<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Campus Crib — find your perfect student home. Search verified boarding houses and rooms near your campus." />

    <!-- PWA manifest (Part 1) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B3D62" />

    <!-- iOS-specific: without these, "Add to Home Screen" produces a
         plain bookmark with a screenshot icon rather than a proper app
         icon/standalone look - iOS does not read manifest.json for
         these, they must be separate meta tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campus Crib" />

    <title>Campus Crib</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
